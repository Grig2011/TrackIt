name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # CRITICAL STEP: This creates the local.properties file safely.
      # Note: We use "printf" instead of "echo" to avoid accidental newline issues
      - name: Create local.properties
        run: |
          touch local.properties
          printf "AI_API_KEY=%s\n" "${{ secrets.AI_API_KEY }}" >> local.properties
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        # We use --no-daemon to ensure a clean environment in CI
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackIt-Debug-Build
          path: app/build/outputs/apk/debug/*.apk