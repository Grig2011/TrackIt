name: Android Build APK

on:
  push:
    branches: [ "main", "master" ] # Triggers on push to main or master
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the source code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java (Android projects usually use JDK 17)
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Create the local.properties file using your GitHub Secrets
      # This keeps your keys out of your code but available for the build
      - name: Create local.properties
        run: |
          echo "AI_API_KEY=${{ secrets.AI_API_KEY }}" >> local.properties
          echo "KEY_TWO=${{ secrets.KEY_TWO }}" >> local.properties
          echo "KEY_THREE=${{ secrets.KEY_THREE }}" >> local.properties

      # 4. Give the runner permission to run the Gradle build tool
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Run the build (This creates the APK)
      # Change 'assembleRelease' to 'assembleDebug' if you don't have signing keys set up yet
      - name: Build APK
        run: ./gradlew assembleDebug

      # 6. Save the APK so you can download it from the Actions tab
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackit-app-build
          path: app/build/outputs/apk/debug/*.apk